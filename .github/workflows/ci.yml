name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate 1 — TypeScript
      - name: TypeScript
        run: pnpm tsc --noEmit

      # Gate 2 — Lint
      - name: Lint
        run: pnpm lint

      # Gate 3 — Build
      - name: Build
        run: pnpm build

      # Gate 4 — Security audit (non-blocking — informational only)
      - name: Audit
        run: pnpm audit --audit-level=high || true

      # Gate 5 — Playwright E2E
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E
        run: pnpm test:e2e
        env:
          CI: true
          # Optional: configure these secrets in GitHub Actions to enable test 5 (form success)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_RECEIVER_EMAIL: ${{ secrets.CONTACT_RECEIVER_EMAIL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
